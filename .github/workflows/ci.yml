name: Validate Solution Delivery
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: solution_test
          POSTGRES_USER: solution_test
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U solution_test -d solution_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://solution_test:ci-only-password@localhost:5432/solution_test
      REDIS_URL: redis://localhost:6379
      APP_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global corepack@0.35.0 && corepack enable
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm db:generate
      - run: corepack pnpm db:migrate
      - run: corepack pnpm format:check
      - run: corepack pnpm lint
      - run: corepack pnpm typecheck
      - run: corepack pnpm test
      - run: node --test --test-isolation=none apps/web/test/vercel-config.test.mjs
      - run: corepack pnpm test:mobile
      - run: corepack pnpm --filter @solution/mobile check
      - run: corepack pnpm test:integration
      - run: corepack pnpm exec playwright install --with-deps chromium
      - run: corepack pnpm test:e2e
      - run: corepack pnpm build
        env:
          EXPO_PUBLIC_API_URL: https://api.example.test/api/v1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report
          retention-days: 7
